<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meus vídeos — gerenciamento dos vídeos do professor">
  <title>EduStream — Meus vídeos</title>
  <link rel="stylesheet" href="./css/player.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./home.html" aria-label="EduStream — início">Edu<span>Stream</span></a>

    <span class="topbar-titulo">Meus vídeos</span>

    <button class="icon-button" id="profileButton" type="button" aria-label="Perfil">👤</button>
    <button class="sair-button" id="sairButton" type="button" title="Sair da conta">Sair</button>
    <button class="btn-primary topbar-upload" id="uploadOpenButton" type="button"
            title="Enviar vídeo para a plataforma">Enviar vídeo</button>
  </header>

  <!-- Modal de upload: o MESMO da home (js/upload.js → iniciarUiUpload),
       reaproveitado aqui para o professor publicar sem sair do painel. -->
  <div class="modal hidden" id="uploadModal" role="dialog" aria-modal="true" aria-labelledby="uploadModalTitle">
    <form class="modal-card" id="uploadForm">
      <div class="modal-header">
        <strong id="uploadModalTitle">Enviar vídeo</strong>
        <button class="icon-button" id="uploadClose" type="button" aria-label="Fechar">×</button>
      </div>

      <label>Arquivo (mp4, avi, mov, webm)
        <input type="file" id="uploadFile" accept=".mp4,.avi,.mov,.webm" required>
      </label>
      <label>Título *
        <input type="text" id="uploadTitulo" maxlength="120" required>
      </label>
      <label>Autor *
        <input type="text" id="uploadAutor" maxlength="80" required>
      </label>
      <label>Descrição
        <textarea id="uploadDescricao" rows="2"></textarea>
      </label>
      <label>Tags (separadas por vírgula)
        <input type="text" id="uploadTags" placeholder="matemática, frações">
      </label>
      <label>Categoria
        <input type="text" id="uploadCategoria" maxlength="60">
      </label>

      <div class="upload-status hidden" id="uploadStatus"></div>
      <button class="btn-primary" id="uploadSubmit" type="submit">Enviar</button>
    </form>
  </div>

  <!-- Modal de edição (PATCH /videos/{id}) — só metadados; status é do pipeline. -->
  <div class="modal hidden" id="editarModal" role="dialog" aria-modal="true" aria-labelledby="editarModalTitle">
    <form class="modal-card" id="editarForm">
      <div class="modal-header">
        <strong id="editarModalTitle">Editar vídeo</strong>
        <button class="icon-button" id="editarClose" type="button" aria-label="Fechar">×</button>
      </div>

      <label>Título *
        <input type="text" id="editarTitulo" maxlength="120" required>
      </label>
      <label>Descrição
        <textarea id="editarDescricao" rows="2"></textarea>
      </label>
      <label>Tags (separadas por vírgula)
        <input type="text" id="editarTags">
      </label>
      <label>Categoria
        <input type="text" id="editarCategoria" maxlength="60">
      </label>

      <div class="upload-status hidden" id="editarStatus"></div>
      <button class="btn-primary" id="editarSubmit" type="submit">Salvar</button>
    </form>
  </div>

  <main class="page">
    <div class="section-title-row">
      <h2>Vídeos publicados por você</h2>
      <span class="home-count" id="painelContagem"></span>
    </div>

    <!-- A lista vem do GET /meus-videos (filtro no BANCO): nunca aparece
         vídeo de outro professor aqui — e as ações só existem no painel
         porque são do dono. -->
    <div id="painelAviso" class="empty-state hidden" role="status"></div>

    <table class="painel-table" id="tabelaVideos" hidden>
      <thead>
        <tr>
          <th scope="col">Título</th>
          <th scope="col">Status</th>
          <th scope="col">Views</th>
          <th scope="col">Publicado em</th>
          <th scope="col">Ações</th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
  </main>

  <script src="./config.js"></script>
  <script type="module" src="./js/sessao.js"></script>
  <script type="module" src="./js/meus-videos.js"></script>
</body>
</html>
